<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHORO | لوحة التحكم الإدارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-6 md:p-12">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl mt-20">
        <h2 class="text-2xl font-black text-amber-500 mb-6 text-center">🔐 تسجيل الدخول لوحة التحكم</h2>
        <form onsubmit="checkLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">كلمة المرور:</label>
                <input type="password" id="admin-pass" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-3 focus:border-amber-500 focus:outline-none" placeholder="••••">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">دخول</button>
        </form>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="max-w-4xl mx-auto space-y-8 hidden">
        <div class="flex justify-between items-center bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h2 class="text-2xl font-black text-amber-500">⚙️ لوحة التحكم السحابية المتكاملة</h2>
            <a href="index.html" target="_blank" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg transition">عرض الموقع 🌐</a>
        </div>

        <!-- 1. إضافة منتج جديد -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">🍔 إضافة منتج جديد للقائمة</h3>
            <form id="add-item-form" onsubmit="addItem(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم الصنف:</label>
                        <input type="text" id="item-name" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">القسم:</label>
                        <select id="item-category" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                            <option value="pizza">بيتزا</option>
                            <option value="broast">بروست</option>
                            <option value="grills">مشاوي</option>
                            <option value="crepe">🌮 الكريب</option>
                            <option value="family">الوجبات العائلية</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">السعر:</label>
                        <input type="text" id="item-price" placeholder="مثال: 100 ر.س" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">رابط الصورة (URL مباشر):</label>
                        <input type="text" id="item-image-url" placeholder="ضع رابط صورة مباشر هنا" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف الصنف:</label>
                    <textarea id="item-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-item" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">إضافة ونشر المنتج فوراً</button>
            </form>
        </div>

        <!-- 2. إدارة المنتجات -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">📋 إدارة الأصناف والمنتجات المنشورة</h3>
            <div id="admin-items-list" class="space-y-4">
                <p class="text-zinc-500 text-center">جاري تحميل المنتجات...</p>
            </div>
        </div>

        <!-- 3. إضافة عرض جديد -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">🔥 إضافة إعلان أو عرض جديد</h3>
            <form id="add-offer-form" onsubmit="addOffer(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">عنوان العرض:</label>
                        <input type="text" id="offer-title" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">سعر العرض:</label>
                        <input type="text" id="offer-price" required placeholder="مثال: 50 ر.س" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">رابط صورة العرض (URL مباشر):</label>
                        <input type="text" id="offer-image-url" placeholder="ضع رابط صورة مباشر هنا" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">وقت انتهاء العرض:</label>
                        <input type="datetime-local" id="offer-time" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف العرض:</label>
                    <textarea id="offer-desc" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 focus:border-amber-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-offer" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-500 transition">تفعيل ونشر العرض فوراً</button>
            </form>
        </div>

        <!-- 4. إدارة الإعلانات -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-amber-400 mb-4">📋 إدارة الإعلانات والعروض المنشورة</h3>
            <div id="admin-offers-list" class="space-y-4">
                <p class="text-zinc-500 text-center">جاري تحميل الإعلانات...</p>
            </div>
        </div>
    </div>

    <!-- سكربت الاتصال المباشر بـ Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABqdG2ML5sMGUlbbakQs1IIqWwc3eBMFY",
            authDomain: "shoro-e4227.firebaseapp.com",
            databaseURL: "https://shoro-e4227-default-rtdb.firebaseio.com",
            projectId: "shoro-e4227",
            storageBucket: "shoro-e4227.firebasestorage.app",
            messagingSenderId: "436007487301",
            appId: "1:436007487301:web:c8eb7587636f7117dae02c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_PASS = "1234";

        window.checkLogin = function(event) {
            event.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if(pass === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadAdminItems();
                loadAdminOffers();
            } else {
                alert('كلمة المرور غير صحيحة! (استخدم 1234)');
            }
        }

        window.addItem = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-item');
            btn.innerText = "جاري النشر الفوري...";
            try {
                const imgUrl = document.getElementById('item-image-url').value.trim();
                const newRef = push(ref(db, 'menu_items'));
                await set(newRef, {
                    name: document.getElementById('item-name').value,
                    category: document.getElementById('item-category').value,
                    price: document.getElementById('item-price').value || '',
                    images: imgUrl ? [imgUrl] : [],
                    desc: document.getElementById('item-desc').value,
                    createdAt: Date.now()
                });
                alert('✅ تم نشر المنتج بنجاح في قاعدة البيانات!');
                document.getElementById('add-item-form').reset();
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "إضافة ونشر المنتج فوراً";
            }
        }

        window.addOffer = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-offer');
            btn.innerText = "جاري نشر العرض...";
            try {
                const imgUrl = document.getElementById('offer-image-url').value.trim();
                const newRef = push(ref(db, 'offers'));
                await set(newRef, {
                    title: document.getElementById('offer-title').value,
                    price: document.getElementById('offer-price').value,
                    images: imgUrl ? [imgUrl] : [],
                    endTime: document.getElementById('offer-time').value,
                    desc: document.getElementById('offer-desc').value,
                    createdAt: Date.now()
                });
                alert('🔥 تم نشر العرض بنجاح في قاعدة البيانات!');
                document.getElementById('add-offer-form').reset();
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "تفعيل ونشر العرض فوراً";
            }
        }

        function loadAdminItems() {
            onValue(ref(db, 'menu_items'), (snapshot) => {
                const container = document.getElementById('admin-items-list');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-zinc-500 text-center py-4">لا توجد منتجات منشورة حالياً.</p>`;
                    return;
                }
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    container.innerHTML += `
                        <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-xl flex items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-amber-400 text-sm">${item.name}</h4>
                                <span class="text-xs text-zinc-400">القسم: ${item.category} | السعر: ${item.price || 'غير محدد'}</span>
                            </div>
                            <button onclick="deleteItem('${key}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">🗑️ حذف</button>
                        </div>
                    `;
                });
            });
        }

        function loadAdminOffers() {
            onValue(ref(db, 'offers'), (snapshot) => {
                const container = document.getElementById('admin-offers-list');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-zinc-500 text-center py-4">لا توجد إعلانات منشورة حالياً.</p>`;
                    return;
                }
                Object.keys(data).reverse().forEach(key => {
                    const offer = data[key];
                    container.innerHTML += `
                        <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-xl flex items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-amber-400 text-sm">${offer.title}</h4>
                                <span class="text-xs text-zinc-400">السعر: ${offer.price}</span>
                            </div>
                            <button onclick="deleteOffer('${key}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">🗑️ حذف</button>
                        </div>
                    `;
                });
            });
        }

        window.deleteItem = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await remove(ref(db, `menu_items/${id}`));
                alert('🗑 تم الحذف بنجاح.');
            }
        }

        window.deleteOffer = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await remove(ref(db, `offers/${id}`));
                alert('🗑 تم الحذف بنجاح.');
            }
        }
    </script>
</body>
</html>
