<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHORO | لوحة التحكم المطورة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 md:p-12">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto bg-slate-900 border border-slate-700 p-8 rounded-2xl shadow-2xl mt-20">
        <h2 class="text-2xl font-black text-cyan-400 mb-6 text-center">🔐 دخول لوحة التحكم (المطورة)</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">كلمة المرور:</label>
                <input type="password" id="admin-pass" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 focus:border-cyan-400 focus:outline-none" placeholder="••••">
            </div>
            <button type="submit" class="w-full bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg hover:bg-cyan-400 transition">دخول آمن</button>
        </form>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="max-w-4xl mx-auto space-y-8 hidden">
        <div class="flex justify-between items-center bg-slate-900 border border-cyan-500/30 p-6 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-black text-cyan-400">🚀 لوحة تحكم شورو المطورة والنشطة</h2>
            <a href="index.html" target="_blank" class="text-sm bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg transition">عرض الموقع 🌐</a>
        </div>

        <!-- 1. إضافة منتج جديد -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-md">
            <h3 class="text-xl font-bold text-cyan-300 mb-4">🍔 إضافة منتج جديد للقائمة</h3>
            <form id="add-item-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم الصنف:</label>
                        <input type="text" id="item-name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">القسم:</label>
                        <select id="item-category" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                            <option value="pizza">بيتزا</option>
                            <option value="broast">بروست</option>
                            <option value="grills">مشاوي</option>
                            <option value="crepe">🌮 الكريب</option>
                            <option value="family">الوجبات العائلية</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">السعر:</label>
                        <input type="text" id="item-price" placeholder="مثال: 100 ر.س" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">صورة المنتج (من الجهاز):</label>
                        <input type="file" id="item-image-file" accept="image/*" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-300 focus:border-cyan-400 focus:outline-none file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف الصنف:</label>
                    <textarea id="item-desc" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-item" class="w-full bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg hover:bg-cyan-400 transition shadow-md">إضافة ونشر المنتج فوراً ⚡</button>
            </form>
        </div>

        <!-- 2. إدارة المنتجات -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-md">
            <h3 class="text-xl font-bold text-cyan-300 mb-4">📋 إدارة الأصناف والمنتجات المنشورة</h3>
            <div id="admin-items-list" class="space-y-4">
                <p class="text-slate-500 text-center">جاري تحميل المنتجات...</p>
            </div>
        </div>

        <!-- 3. إضافة عرض جديد -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-md">
            <h3 class="text-xl font-bold text-cyan-300 mb-4">🔥 إضافة إعلان أو عرض جديد</h3>
            <form id="add-offer-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">عنوان العرض:</label>
                        <input type="text" id="offer-title" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">سعر العرض:</label>
                        <input type="text" id="offer-price" required placeholder="مثال: 50 ر.س" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">صورة العرض (من الجهاز):</label>
                        <input type="file" id="offer-image-file" accept="image/*" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-300 focus:border-cyan-400 focus:outline-none file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-rose-600 file:text-white hover:file:bg-rose-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">وقت انتهاء العرض:</label>
                        <input type="datetime-local" id="offer-time" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف العرض:</label>
                    <textarea id="offer-desc" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyan-400 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btn-offer" class="w-full bg-rose-600 text-white font-bold py-3 rounded-lg hover:bg-rose-500 transition shadow-md">تفعيل ونشر العرض فوراً 🔥</button>
            </form>
        </div>

        <!-- 4. إدارة الإعلانات -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-md">
            <h3 class="text-xl font-bold text-cyan-300 mb-4">📋 إدارة الإعلانات والعروض المنشورة</h3>
            <div id="admin-offers-list" class="space-y-4">
                <p class="text-slate-500 text-center">جاري تحميل الإعلانات...</p>
            </div>
        </div>
    </div>

    <!-- سكربت التشغيل المعتمد -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABqdG2ML5sMGUlbbakQs1IIqWwc3eBMFY",
            authDomain: "shoro-e4227.firebaseapp.com",
            databaseURL: "https://shoro-e4227-default-rtdb.firebaseio.com",
            projectId: "shoro-e4227",
            storageBucket: "shoro-e4227.firebasestorage.app",
            messagingSenderId: "436007487301",
            appId: "1:436007487301:web:c8eb7587636f7117dae02c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, "https://shoro-e4227-default-rtdb.firebaseio.com");
        const ADMIN_PASS = "1234";

        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if(pass === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadAdminItems();
                loadAdminOffers();
            } else {
                alert('كلمة المرور غير صحيحة! (استخدم 1234)');
            }
        });

        function processImage(file) {
            return new Promise((resolve) => {
                if (!file) {
                    resolve('');
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                    img.onerror = () => resolve('');
                };
                reader.onerror = () => resolve('');
            });
        }

        document.getElementById('add-item-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-item');
            btn.innerText = "جاري النشر الفوري ⚡...";
            btn.disabled = true;

            try {
                const fileInput = document.getElementById('item-image-file');
                let imageUrl = '';

                if (fileInput.files && fileInput.files[0]) {
                    imageUrl = await processImage(fileInput.files[0]);
                }

                const newRef = push(ref(db, 'menu_items'));
                await set(newRef, {
                    name: document.getElementById('item-name').value,
                    category: document.getElementById('item-category').value,
                    price: document.getElementById('item-price').value || '',
                    images: imageUrl ? [imageUrl] : [],
                    desc: document.getElementById('item-desc').value,
                    createdAt: Date.now()
                });

                document.getElementById('add-item-form').reset();
                alert('✅ تم نشر المنتج بنجاح وتفريغ الحقول!');
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "إضافة ونشر المنتج فوراً ⚡";
                btn.disabled = false;
            }
        });

        document.getElementById('add-offer-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-offer');
            btn.innerText = "جاري نشر العرض 🔥...";
            btn.disabled = true;

            try {
                const fileInput = document.getElementById('offer-image-file');
                let imageUrl = '';

                if (fileInput.files && fileInput.files[0]) {
                    imageUrl = await processImage(fileInput.files[0]);
                }

                const newRef = push(ref(db, 'offers'));
                await set(newRef, {
                    title: document.getElementById('offer-title').value,
                    price: document.getElementById('offer-price').value,
                    images: imageUrl ? [imageUrl] : [],
                    endTime: document.getElementById('offer-time').value,
                    desc: document.getElementById('offer-desc').value,
                    createdAt: Date.now()
                });

                document.getElementById('add-offer-form').reset();
                alert('🔥 تم نشر العرض بنجاح وتفريغ الحقول!');
            } catch(e) {
                alert('خطأ أثناء النشر: ' + e.message);
            } finally {
                btn.innerText = "تفعيل ونشر العرض فوراً 🔥";
                btn.disabled = false;
            }
        });

        function loadAdminItems() {
            onValue(ref(db, 'menu_items'), (snapshot) => {
                const container = document.getElementById('admin-items-list');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-slate-500 text-center py-4">لا توجد منتجات منشورة حالياً.</p>`;
                    return;
                }
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    container.innerHTML += `
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-cyan-400 text-sm">${item.name}</h4>
                                <span class="text-xs text-slate-400">القسم: ${item.category} | السعر: ${item.price || 'غير محدد'}</span>
                            </div>
                            <button type="button" onclick="deleteItem('${key}')" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">🗑️ حذف</button>
                        </div>
                    `;
                });
            });
        }

        function loadAdminOffers() {
            onValue(ref(db, 'offers'), (snapshot) => {
                const container = document.getElementById('admin-offers-list');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-slate-500 text-center py-4">لا توجد إعلانات منشورة حالياً.</p>`;
                    return;
                }
                Object.keys(data).reverse().forEach(key => {
                    const offer = data[key];
                    container.innerHTML += `
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-cyan-400 text-sm">${offer.title}</h4>
                                <span class="text-xs text-slate-400">السعر: ${offer.price}</span>
                            </div>
                            <button type="button" onclick="deleteOffer('${key}')" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">🗑️ حذف</button>
                        </div>
                    `;
                });
            });
        }

        window.deleteItem = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await remove(ref(db, `menu_items/${id}`));
                alert('🗑 تم الحذف بنجاح.');
            }
        }

        window.deleteOffer = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await remove(ref(db, `offers/${id}`));
                alert('🗑 تم الحذف بنجاح.');
            }
        }
    </script>
</body>
</html>
